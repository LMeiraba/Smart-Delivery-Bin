<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Delivery Bin - Dashboard</title>
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <main class="dashboard-container">
        <header style="text-align: center;">
            <img src="/app_icon.png" alt="App Icon" style="width: 80px; height: 80px; border-radius: 20px; margin-bottom: 1rem; box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);">
            <h1>Smart Delivery Bin</h1>
            <p>Generate a secure one-time password for your courier.</p>
        </header>

        <form id="otp-form" class="glass-panel">
            <div class="form-group-row">
                <div class="form-group">
                    <label for="boxId">Box ID</label>
                    <input type="text" id="boxId" name="boxId" placeholder="e.g. BIN-001" required>
                </div>
                
                <div class="form-group">
                    <label for="phoneNumber">Courier Phone</label>
                    <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="e.g. 9876543210" required>
                </div>
            </div>

            <div class="form-group-row">
                <div class="form-group">
                    <label for="title">Package Title</label>
                    <input type="text" id="title" name="title" placeholder="e.g. Amazon Delivery (Optional)">
                </div>

                <div class="form-group">
                    <label for="pin">Admin PIN <span class="lock-icon">🔒</span></label>
                    <input type="password" id="pin" name="pin" placeholder="Enter PIN to authorize" required>
                </div>
            </div>

            <div class="form-group">
                <label for="description">Delivery Instructions</label>
                <textarea id="description" name="description" placeholder="e.g. Fragile package, place gently. (Optional)" rows="3"></textarea>
            </div>

            <button type="submit" id="generate-btn">
                <span>Generate OTP</span>
                <div class="loader hidden" id="btn-loader"></div>
            </button>
            <div id="status-message" class="status-msg hidden"></div>
        </form>

        <section class="active-otps glass-panel mt-4">
            <h2>Active Deliveries</h2>
            <div id="otps-list" class="otps-list">
                <!-- Populated by JS -->
            </div>
        </section>

        <section class="glass-panel mt-4" style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
            <h2 style="font-size: 1.1rem; color: #888;">Admin Controls</h2>
            <div class="form-group" style="display: flex; gap: 10px; margin-top: 15px;">
                <input type="text" id="clear-box-id" placeholder="Box ID (e.g. BIN-001)" style="flex: 1;">
                <button type="button" id="clear-logs-btn" style="background: rgba(255,50,50,0.1); color: #ff5555; border: 1px solid rgba(255,50,50,0.2); width: auto; padding: 12px 20px;">
                    Clear Logs
                </button>
            </div>
            <div id="clear-status" class="status-msg hidden" style="font-size: 0.9rem;"></div>
        </section>
    </main>
    <script src="/script.js"></script>
</body>
</html>
