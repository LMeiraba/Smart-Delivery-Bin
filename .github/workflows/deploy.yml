name: Deploy to Google Cloud VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Fix Git dubious ownership issue
            git config --global --add safe.directory /home/meiraba_school/node/Smart-Delivery-Bin
            
            cd /home/meiraba_school/node/Smart-Delivery-Bin
            
            # Force pull latest changes, discarding any local edits on the server
            git fetch origin main
            git reset --hard origin/main
            
            # Install any new dependencies
            npm install
            
            # Restart PM2 process (or start it if it doesn't exist)
            sudo pm2 restart delivery-box || sudo pm2 start server.js --name delivery-box
            
            # Save the PM2 process list so it automatically restarts if the VM reboots
            sudo pm2 save
            sudo pm2 startup

      - name: Notify on Failure
        if: failure()
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          content: "@everyone DEPLOYMENT FAILED! "
          embed-description: "The Smart Delivery Bin API deployment failed. Check the GitHub Actions log for details: \n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          embed-title: "Deployment FAILED!"
          embed-color: 15158332 # Red

      - name: Notify on Success
        if: success()
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          content: "@everyone Deployment process successful!."
          embed-description: "The Smart Delivery Bin API was successfully updated with the latest push."
          embed-title: "✅ Deployment Successful!"
          embed-color: 3066993
