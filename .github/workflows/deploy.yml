name: Deploy to Google Cloud VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Replace /path/to/your/project with your actual VM path
            cd /path/to/delivery-box
            
            # Pull latest changes
            git pull origin main
            
            # Install any new dependencies
            npm install
            
            # Restart PM2 process (Replace 'delivery-box' with your PM2 app name)
            pm2 restart delivery-box
